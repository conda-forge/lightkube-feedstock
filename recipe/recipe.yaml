schema_version: 1

context:
  version: "1.0.2"

package:
  name: lightkube
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightkube/lightkube-${{ version }}.tar.gz
  sha256: 13c770cfe13890afc32dcabf06490e256bd581b374bdc6f2e7553ed2ff868f0c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.6,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - lightkube-models >=1.15.12.0
    - httpx2 >=0.28.1
    - h2 >=3,<5
    - wsproto >=1.2
    - msgspec >=0.18
    - pyyaml

tests:
  - python:
      imports:
        - lightkube
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Lightweight kubernetes client library
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/lightkube/

extra:
  recipe-maintainers:
    - janjagusch
