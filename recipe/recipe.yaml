schema_version: 1

context:
  version: "0.21.0"

package:
  name: lightkube
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightkube/lightkube-${{ version }}.tar.gz
  sha256: 720910200de4bd88e0d7b5d2edfb45a4f6be292798b8776d7b551ef5a5ccdc15

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.6,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - lightkube-models >=1.15.12.0
    - httpx >=0.28.1,<1.0.0
    - httpx-ws
    - pyyaml

tests:
  - python:
      imports:
        - lightkube
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Lightweight kubernetes client library
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/lightkube/

extra:
  recipe-maintainers:
    - janjagusch
