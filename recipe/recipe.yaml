schema_version: 1

context:
  version: "1.0.0"

package:
  name: lightkube
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lightkube/lightkube-${{ version }}.tar.gz
  sha256: 28fcdb3acce2ffcd3fa6b149cdf43186a4a6a9ce1c43c0e3c6bbc4575c478570

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.6,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - lightkube-models >=1.15.12.0
    - httpx >=0.28.1,<1.0.0
    - httpx-ws
    - pyyaml

tests:
  - python:
      imports:
        - lightkube
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Lightweight kubernetes client library
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/lightkube/

extra:
  recipe-maintainers:
    - janjagusch
